# SAJ H2 Safe Enhanced dashboard (built-in Home Assistant cards only)
# Paste into the RAW configuration editor of a new YAML dashboard.
# Entity IDs assume the default device name "SAJ H2 Safe Monitor".
# If an entity was renamed in Home Assistant, adjust the IDs here.
title: SAJ Energy
views:
  - title: Live
    path: live
    icon: mdi:home-lightning-bolt
    type: panel
    cards:
      - type: vertical-stack
        cards:
          # Fixed top row: live flow LEFT, 24-hour power chart RIGHT.
          - type: horizontal-stack
            cards:
              - type: markdown
                content: |
                  {% macro p(entity, absolute=false) -%}
                    {%- set raw = states(entity) -%}
                    {%- if is_number(raw) -%}
                      {%- set v = raw | float | abs if absolute else raw | float -%}
                      {{- ('%.2f kW' | format(v / 1000)) if (v | abs >= 1000) else ('%.0f W' | format(v)) -}}
                    {%- else -%}—{%- endif -%}
                  {%- endmacro %}
                  {% macro e(entity) -%}
                    {%- set raw = states(entity) -%}
                    {%- if is_number(raw) -%}
                      {%- set v = raw | float -%}
                      {{- ('%.2f kWh' | format(v)) if (v | abs >= 1) else ('%.0f Wh' | format(v * 1000)) -}}
                    {%- else -%}—{%- endif -%}
                  {%- endmacro %}
                  {% set solar = 'sensor.saj_h2_safe_monitor_total_solar_power' %}
                  {% set home = 'sensor.saj_h2_safe_monitor_home_consumption' %}
                  {% set battery = 'sensor.saj_h2_safe_monitor_battery_power' %}
                  {% set soc = 'sensor.saj_h2_safe_monitor_battery_state_of_charge' %}
                  {% set imp = 'sensor.saj_h2_safe_monitor_grid_import_direction_unverified' %}
                  {% set exp = 'sensor.saj_h2_safe_monitor_grid_export_direction_unverified' %}
                  {% set b = states(battery) | float(0) %}
                  {% set gi = states(imp) | float(0) %}
                  {% set ge = states(exp) | float(0) %}
                  {% set outlook = 'sensor.saj_h2_safe_monitor_today_s_solar_outlook_actual_remaining' %}
                  {% set remaining = 'sensor.saj_h2_safe_monitor_solar_forecast_remaining_today' %}
                  {% set tomorrow = 'sensor.saj_h2_safe_monitor_tomorrow_s_solar_forecast' %}
                  {% set battery_percent = states(soc) | float(0) %}
                  {% set filled = [(battery_percent / 10) | round(0, 'floor') | int, 10] | min %}
                  ## Live energy flow · {{ states(soc) }}% · {{ e('sensor.saj_h2_safe_monitor_estimated_battery_energy') }} · {{ '▰' * filled }}{{ '▱' * (10 - filled) }}

                  | ☀️ Solar | 🏠 House | 🔋 Battery | ⚡ Grid | 🔮 Forecast |
                  |:---:|:---:|:---:|:---:|:---:|
                  | **{{ p(solar) }}** | **{{ p(home) }}** | **{{ p(battery, true) }}** | **{{ p(imp) }}** | **{{ e(outlook) }} Today** |
                  | Generating | Using | {{ 'Discharging ↗' if b > 15 else 'Charging ↙' if b < -15 else 'Idle' }} | Import | **{{ e(remaining) }}** remaining |
                  | | | **{{ states(soc) }}%** · **{{ e('sensor.saj_h2_safe_monitor_estimated_battery_energy') }}** | **{{ p(exp) }}** export | **{{ e(tomorrow) }}** tomorrow |

                  **{{ 'Grid → House' if gi > 0 else 'House → Grid' if ge > 0 else 'No net grid exchange' }}** · **{{ states('sensor.saj_h2_safe_monitor_operating_mode') }}**

                  *Forecast is an estimate (today total = measured + predicted remaining). Grid direction provisional; read-only.*
              - type: history-graph
                title: Power · 24 hours
                hours_to_show: 24
                refresh_interval: 10
                entities:
                  - entity: sensor.saj_h2_safe_monitor_total_solar_power
                    name: Total PV
                  - entity: sensor.saj_h2_safe_monitor_home_consumption
                    name: House Load
                  - entity: sensor.saj_h2_safe_monitor_battery_power
                    name: Battery Power
                  - entity: sensor.saj_h2_safe_monitor_grid_power_raw_signed
                    name: Grid Power

          # Smaller detail cards; no repeated battery or flow summaries.
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.saj_h2_safe_monitor_battery_state_of_charge
                name: Battery SOC
                min: 0
                max: 100
                severity:
                  red: 0
                  yellow: 20
                  green: 45
              - type: markdown
                title: Battery
                content: |
                  {% set activity = states('sensor.saj_h2_safe_monitor_battery_activity') %}
                  {% set watts = states('sensor.saj_h2_safe_monitor_battery_power') %}
                  {% set stored = states('sensor.saj_h2_safe_monitor_estimated_battery_energy') %}
                  **{{ activity }}**
                  
                  {% if is_number(watts) %}
                  **{{ '%.2f kW' | format(watts | float | abs / 1000) if watts | float | abs >= 1000 else '%.0f W' | format(watts | float | abs) }}**
                  {% else %}
                  **—**
                  {% endif %}

                  Stored: {{ '%.2f kWh' | format(stored | float) if is_number(stored) and stored | float >= 1 else '%.0f Wh' | format(stored | float * 1000) if is_number(stored) else '—' }}
              - type: markdown
                title: PV inputs
                content: |
                  {% macro fmt(entity) -%}
                  {%- set v = states(entity) -%}
                  {{- ('%.2f kW' | format(v | float / 1000)) if is_number(v) and v | float >= 1000 else ('%.0f W' | format(v | float)) if is_number(v) else '—' -}}
                  {%- endmacro %}
                  ☀️ **PV1** · {{ fmt('sensor.saj_h2_safe_monitor_pv1_power') }}

                  ☀️ **PV2** · {{ fmt('sensor.saj_h2_safe_monitor_pv2_power') }}

                  ☀️ **PV3** · {{ fmt('sensor.saj_h2_safe_monitor_pv3_power') }}
              - type: history-graph
                title: Battery SOC · 24 hours
                hours_to_show: 24
                refresh_interval: 30
                entities:
                  - entity: sensor.saj_h2_safe_monitor_battery_state_of_charge
                    name: Battery SOC
  - title: Energy
    path: energy
    icon: mdi:chart-bar
    cards:
      - type: markdown
        title: Energy overview
        content: |
          {% macro e(entity) -%}
          {%- set v = states(entity) -%}
          {{- ('%.2f kWh' | format(v | float)) if is_number(v) and v | float >= 1 else ('%.0f Wh' | format(v | float * 1000)) if is_number(v) else '—' -}}
          {%- endmacro %}
          ## 📊 Production & Consumption

          | | Today | This month | This year |
          |:---|---:|---:|---:|
          | ☀️ Solar | {{ e('sensor.saj_h2_safe_monitor_solar_today') }} | {{ e('sensor.saj_h2_safe_monitor_solar_month') }} | {{ e('sensor.saj_h2_safe_monitor_solar_year') }} |
          | 🏠 Home | {{ e('sensor.saj_h2_safe_monitor_home_consumed_today') }} | {{ e('sensor.saj_h2_safe_monitor_home_consumed_month') }} | {{ e('sensor.saj_h2_safe_monitor_home_consumed_year') }} |
          | 🔋 Charged | {{ e('sensor.saj_h2_safe_monitor_battery_charged_today') }} | {{ e('sensor.saj_h2_safe_monitor_battery_charged_month') }} | {{ e('sensor.saj_h2_safe_monitor_battery_charged_year') }} |
          | 🔋 Discharged | {{ e('sensor.saj_h2_safe_monitor_battery_discharged_today') }} | {{ e('sensor.saj_h2_safe_monitor_battery_discharged_month') }} | {{ e('sensor.saj_h2_safe_monitor_battery_discharged_year') }} |

          Weekly figures and historical charts are generated from Home Assistant's accumulated statistics. Grid counter mapping is still being verified.
      - type: entities
        title: Today
        entities:
          - sensor.saj_h2_safe_monitor_solar_today
          - sensor.saj_h2_safe_monitor_home_consumed_today
          - sensor.saj_h2_safe_monitor_battery_charged_today
          - sensor.saj_h2_safe_monitor_battery_discharged_today
          - sensor.saj_h2_safe_monitor_saj_grid_sell_unverified_today
          - sensor.saj_h2_safe_monitor_saj_grid_feed_in_unverified_today
      - type: entities
        title: This month
        entities:
          - sensor.saj_h2_safe_monitor_solar_month
          - sensor.saj_h2_safe_monitor_home_consumed_month
          - sensor.saj_h2_safe_monitor_battery_charged_month
          - sensor.saj_h2_safe_monitor_battery_discharged_month
      - type: entities
        title: This year
        entities:
          - sensor.saj_h2_safe_monitor_solar_year
          - sensor.saj_h2_safe_monitor_home_consumed_year
          - sensor.saj_h2_safe_monitor_battery_charged_year
          - sensor.saj_h2_safe_monitor_battery_discharged_year
      - type: statistics-graph
        title: Weekly solar generation
        chart_type: bar
        period: week
        days_to_show: 56
        stat_types:
          - change
        entities:
          - sensor.saj_h2_safe_monitor_solar_total
      - type: statistics-graph
        title: Weekly home usage
        chart_type: bar
        period: week
        days_to_show: 56
        stat_types:
          - change
        entities:
          - sensor.saj_h2_safe_monitor_home_consumed_total
      - type: statistics-graph
        title: Monthly solar production
        chart_type: bar
        period: month
        days_to_show: 365
        stat_types:
          - change
        entities:
          - sensor.saj_h2_safe_monitor_solar_total

  - title: Solar Forecast
    path: solar-forecast
    icon: mdi:weather-sunny
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            title: SolarCast · Live-informed forecast
            content: |
              {% set today = states('sensor.saj_h2_safe_monitor_today_s_solar_forecast') %}
              {% set outlook = states('sensor.saj_h2_safe_monitor_today_s_solar_outlook_actual_remaining') %}
              {% set tomorrow = states('sensor.saj_h2_safe_monitor_tomorrow_s_solar_forecast') %}
              {% set remain = states('sensor.saj_h2_safe_monitor_solar_forecast_remaining_today') %}
              {% set actual = states('sensor.saj_h2_safe_monitor_solar_today') %}
              {% macro val(v) -%}
              {{- ('%.2f kWh' | format(v | float)) if is_number(v) else '—' -}}
              {%- endmacro %}
              ## ☀️ Solar generation outlook

              | Produced today | Remaining today | End-of-day outlook | Tomorrow |
              |:---:|:---:|:---:|:---:|
              | **{{ val(actual) }}** | **{{ val(remain) }}** | **{{ val(outlook) }}** | **{{ val(tomorrow) }}** |

              *End-of-day outlook combines measured solar so far with the forecast remaining. Forecasts are estimates, not inverter commands.*

              {{ states('sensor.saj_h2_safe_monitor_forecast_learning') }} · Updated {{ states('sensor.saj_h2_safe_monitor_weather_forecast_updated') }}

          - type: horizontal-stack
            cards:
              - type: markdown
                title: Next seven days
                content: |
                  {% set days = state_attr('sensor.saj_h2_safe_monitor_today_s_solar_forecast', 'daily') or [] %}
                  {% if days %}
                  {% set mx = [days | map(attribute='kwh') | max, 0.1] | max %}
                  | Day | Energy | Relative output |
                  |:---|---:|:---|
                  {% for d in days %}
                  | {{ d.date[5:] }} | **{{ '%.1f' | format(d.kwh) }} kWh** | {{ '▰' * ((d.kwh / mx * 14) | int) }}{{ '▱' * (14 - (d.kwh / mx * 14) | int) }} |
                  {% endfor %}
                  {% else %}
                  Waiting for the weather forecast. Check Home Assistant's connection to Open-Meteo.
                  {% endif %}
              - type: markdown
                title: Next twelve hours
                content: |
                  {% set hours = state_attr('sensor.saj_h2_safe_monitor_today_s_solar_forecast', 'hourly') or [] %}
                  {% if hours %}
                  | Hour starting | Estimated production | Cloud |
                  |:---|---:|---:|
                  {% for h in hours[:12] %}
                  | {{ h.time }} | {{ '%.2f' | format(h.kwh) }} kWh | {{ h.cloud }}% |
                  {% endfor %}
                  {% else %}
                  Hourly weather data is not available yet.
                  {% endif %}
          - type: horizontal-stack
            cards:
              - type: entities
                title: Forecast details
                entities:
                  - entity: sensor.saj_h2_safe_monitor_today_s_solar_forecast
                    name: Full-day forecast
                  - entity: sensor.saj_h2_safe_monitor_solar_forecast_remaining_today
                    name: Remaining today
                  - entity: sensor.saj_h2_safe_monitor_today_s_solar_outlook_actual_remaining
                    name: Today · measured + remaining
                  - entity: sensor.saj_h2_safe_monitor_tomorrow_s_solar_forecast
                    name: Tomorrow
                  - entity: sensor.saj_h2_safe_monitor_next_7_days_solar_forecast
                    name: Next 7 days
                  - entity: sensor.saj_h2_safe_monitor_forecast_learning
                    name: Learning status
              - type: history-graph
                title: Actual vs projected · Today
                hours_to_show: 24
                entities:
                  - entity: sensor.saj_h2_safe_monitor_solar_today
                    name: Solar actual
                  - entity: sensor.saj_h2_safe_monitor_today_s_solar_outlook_actual_remaining
                    name: Solar outlook
          - type: markdown
            title: How the forecast improves
            content: |
              **Model:** 30 × 440 W bifacial solar panels, in groups of 9 / 15 / 6 with initial compass azimuths 29° / 27° / 299°, tilt 25°, combined efficiency 87%, capped at 10 kW AC.

              Uses Open-Meteo tilted irradiance for each group and your Home Assistant location. This is an **initial configuration copied from SolarCast** — check roof orientation and panel counts before relying on predictions.

              **Self-correction:** Only relatively clear hours with at least 45 minutes of reliable actual power readings are eligible for hour-of-day adjustment. Learned adjustments are capped to avoid runaway changes.

              **Important:** Cloud forecast errors, shade, and inverter curtailment may all reduce actual output. A low reading alone cannot prove which cause applies. Learning skips high-battery-SOC conditions that could represent curtailment. This is not a weather-independent guarantee.

              **Privacy and safety:** Home Assistant shares its configured coordinates with Open-Meteo to request forecasts. The integration remains read-only and never adjusts inverter operating modes.
