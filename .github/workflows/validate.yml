name: Validate read-only integration
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check standalone monitoring card JavaScript syntax
        run: node --check custom_components/saj_h2_safe/frontend/saj-safe-monitor-card.js
      - name: Run standalone dashboard interaction smoke
        run: node tests/test_dashboard.cjs
      - name: Check shell installer syntax
        run: bash -n scripts/install.sh
      - name: Compile Python files
        run: python -m compileall -q custom_components/saj_h2_safe tests
      - name: Run decoding checks (no inverter required)
        run: |
          python tests/test_decode.py
          python tests/test_solar_model.py
      - name: Ensure Modbus write functions are absent
        run: |
          if grep -R -nE 'write_registers?\(|write_coils?\(' custom_components/saj_h2_safe --include='*.py'; then
            echo 'Writable Modbus method found'; exit 1
          fi
